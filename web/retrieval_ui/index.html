<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIC Retrieval UI</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="Search controls">
        <div class="brand">
          <h1>AIC L21 Retrieval</h1>
          <p id="health">Loading index...</p>
          <div class="mode-tabs" aria-label="Search mode">
            <button id="visual-mode-button" class="mode-button is-active" type="button" aria-pressed="true">Visual</button>
            <button id="metadata-mode-button" class="mode-button" type="button" aria-pressed="false">Metadata</button>
          </div>
          <div id="ranking-tabs" class="mode-tabs ranking-tabs" aria-label="Visual ranking mode">
            <button id="video-ranking-button" class="mode-button is-active" type="button" aria-pressed="true">Video Ranking</button>
            <button id="frame-ranking-button" class="mode-button" type="button" aria-pressed="false">Frame Ranking</button>
          </div>
        </div>
        <form id="search-form" class="search-form">
          <label class="query-field">
            <span>Vietnamese query</span>
            <input id="query" name="query" type="search" autocomplete="off" placeholder="người đang cầm điện thoại" required>
          </label>
          <button id="translate-button" class="secondary-button" type="button">Translate</button>
          <label class="clip-query-field">
            <span>CLIP query</span>
            <input id="clip-query" name="clip-query" type="search" autocomplete="off" placeholder="a person holding a phone">
          </label>
          <label>
            <span id="top-k-label">Top videos</span>
            <input id="top-k" name="top-k" type="number" min="1" max="50" value="12">
          </label>
          <label>
            <span>Frame pool</span>
            <input id="candidate-pool" name="candidate-pool" type="number" min="1" max="200" value="40">
          </label>
          <button id="search-button" type="submit">Search</button>
        </form>
      </section>

      <section class="status-row" aria-live="polite">
        <div id="status" class="status">Ready.</div>
        <button id="export-button" class="secondary-button" type="button" disabled>Export CSV</button>
      </section>

      <section class="workspace">
        <section id="results" class="results-grid" aria-label="Search results"></section>
        <aside class="side-panel" aria-label="Pinned results and search history">
          <section class="panel-section">
            <div class="panel-head">
              <h2>Pins</h2>
              <button id="export-pins-button" class="secondary-button small-button" type="button" disabled>Export Pins</button>
            </div>
            <div id="pins-list" class="compact-list"></div>
          </section>
          <section class="panel-section">
            <div class="panel-head">
              <h2>History</h2>
              <button id="clear-history-button" class="secondary-button small-button" type="button">Clear</button>
            </div>
            <div id="history-list" class="compact-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <template id="result-template">
      <article class="result-card">
        <div class="thumb-wrap">
          <img class="thumb" alt="">
          <div class="missing-thumb">No image</div>
          <span class="rank"></span>
        </div>
        <div class="result-body">
          <div class="result-head">
            <strong class="video-id"></strong>
            <span class="score-wrap"><span class="score-label"></span>: <span class="score"></span></span>
          </div>
          <p class="title"></p>
          <dl class="facts">
            <div><dt class="keyframe-label">Keyframe</dt><dd class="keyframe"></dd></div>
            <div><dt>Time</dt><dd class="time"></dd></div>
            <div class="matched-fact"><dt>Matched in pool</dt><dd class="matched-count"></dd></div>
            <div><dt>Author</dt><dd class="author"></dd></div>
            <div><dt>Date</dt><dd class="date"></dd></div>
          </dl>
          <div class="keywords"></div>
          <div class="review-panel">
            <button class="pin-button secondary-button" type="button" aria-pressed="false">Pin</button>
            <button class="explore-button secondary-button" type="button" aria-expanded="false">Explore video</button>
            <div class="explore-panel" hidden></div>
            <button class="neighborhood-button secondary-button" type="button" aria-expanded="false">Neighbors</button>
            <div class="neighborhood-panel" hidden></div>
            <div class="judgement-buttons" aria-label="Manual judgement">
              <button class="judgement-button" type="button" data-judgement="good" aria-pressed="false">Good</button>
              <button class="judgement-button" type="button" data-judgement="partial" aria-pressed="false">Partial</button>
              <button class="judgement-button" type="button" data-judgement="bad" aria-pressed="false">Bad</button>
            </div>
            <label class="note-label">
              <span>Note</span>
              <input class="note-input" type="text" placeholder="short review note">
            </label>
          </div>
        </div>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
