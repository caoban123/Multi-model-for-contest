<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRAKE Workspace</title><link rel="stylesheet" href="/trake/static/styles.css"></head>
<body>
<main>
  <header><p class="eyebrow">PHASE 8 · L21 · LOCAL</p><h1>TRAKE workspace</h1><p>Tìm một video chứa chuỗi sự kiện theo đúng thứ tự. Mọi xác nhận cần review thủ công.</p></header>
  <section class="query-bar"><label>Truy vấn chuỗi<input id="query" placeholder="Cửa mở → một người bước vào"></label><button id="plan">Tách events</button><button id="search" disabled>Retrieve</button><button id="align" disabled>Align timeline</button></section>
  <p id="message" role="status"></p>
  <section class="workspace">
    <article><div class="title-row"><h2>Event editor</h2><button id="add-event" disabled>+ Event</button><button id="save-plan" disabled>Save revision</button></div><div id="events" class="events"></div><p class="hint">Sửa nội dung/required; dùng ↑, xóa hoặc thêm rồi lưu plan revision mới.</p></article>
    <article><h2>Candidate videos</h2><div id="videos"></div></article>
    <article><h2>Timeline & top chains</h2><div id="chains"></div></article>
  </section>
  <section class="review"><h2>Manual correction & review</h2><p id="selection">Chưa chọn chain.</p><div id="corrections"></div><label>Reviewer<input id="reviewer" value="local-reviewer"></label><button id="confirm" disabled>Confirm</button><button id="reject" disabled>Reject</button><button id="export" disabled>Export internal record</button></section>
</main><script src="/trake/static/app.js"></script>
</body></html>
